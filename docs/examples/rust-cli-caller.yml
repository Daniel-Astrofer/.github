# Example: Calling admin-cli-ci.yml for a Rust CLI (kerosene-rsctl)
#
# Consumers must pin the reusable workflow to an immutable commit SHA.
# Replace <sha> with the actual commit hash from the .github repository.

name: kerosene-rsctl CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  rsctl:
    uses: Daniel-Astrofer/.github/.github/workflows/admin-cli-ci.yml@abc123def456abc123def456abc123def456abc1
    with:
      language: rust
      package: kerosene-rsctl
