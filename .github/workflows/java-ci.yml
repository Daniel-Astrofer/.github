name: Reusable Java CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      gradle-arguments:
        type: string
        default: check
      run-dependency-audit:
        type: boolean
        default: false
    secrets:
      nvd-api-key:
        description: Optional NVD API key used by OWASP Dependency-Check
        required: false

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Gradle verification
        run: ./gradlew ${{ inputs.gradle-arguments }} --no-daemon
      - name: Audit dependency vulnerabilities
        if: inputs.run-dependency-audit
        env:
          NVD_API_KEY: ${{ secrets.nvd-api-key }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon
