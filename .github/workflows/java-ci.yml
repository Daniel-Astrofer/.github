name: Reusable Java CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      gradle-arguments:
        type: string
        default: test

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Gradle verification
        run: ./gradlew ${{ inputs.gradle-arguments }} --no-daemon
