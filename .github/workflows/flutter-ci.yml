name: Reusable Flutter CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      flutter-version:
        type: string
        default: '3.32.8'
      enforce-analyze:
        type: boolean
        default: true
      analyze-arguments:
        description: Additional flutter analyze arguments
        type: string
        default: ''
      run-tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate working-directory
        shell: bash
        env:
          WD: ${{ inputs.working-directory }}
        run: |
          if [[ "${WD}" == *".."* || "${WD}" == /* ]]; then
            echo "::error::working-directory input validation failed: path traversal detected"
            exit 1
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - if: inputs.enforce-analyze
        run: flutter analyze ${{ inputs.analyze-arguments }}
      - if: inputs.run-tests
        run: flutter test
