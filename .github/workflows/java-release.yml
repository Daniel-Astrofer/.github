name: Reusable Java CLI Release

on:
  workflow_call:
    inputs:
      package:
        description: Gradle application project name
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify and package
        env:
          PACKAGE: ${{ inputs.package }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          project_version="$(./gradlew -q ":${PACKAGE}:properties" --property version |
            awk -F': ' '$1 == "version" {print $2; exit}')"
          [[ "${RELEASE_TAG#v}" == "${project_version}" ]] || {
            echo "::error::Release tag does not match ${PACKAGE} ${project_version}"
            exit 1
          }
          ./gradlew ":${PACKAGE}:check" ":${PACKAGE}:installDist" --no-daemon
          mkdir -p dist
          tar -C "${PACKAGE}/build/install" -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"
          (cd dist && sha256sum "${PACKAGE}.tar.gz" > SHA256SUMS)
          java -version 2> dist/java-toolchain.txt
      - uses: anchore/sbom-action@v0
        with:
          path: dist/${{ inputs.package }}.tar.gz
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign distribution
        env:
          PACKAGE: ${{ inputs.package }}
        run: cosign sign-blob --yes --bundle "dist/${PACKAGE}.sigstore.json" "dist/${PACKAGE}.tar.gz"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/${{ inputs.package }}.tar.gz
            dist/SHA256SUMS
            dist/sbom.spdx.json
      - name: Upload release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
