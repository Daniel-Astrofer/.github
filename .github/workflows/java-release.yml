name: Reusable Java CLI Release

on:
  workflow_call:
    inputs:
      package:
        description: Gradle application project name
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and attest release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to upload assets to the published release.
      id-token: write # Required for keyless Sigstore signing and provenance.
      attestations: write # Required to publish build provenance.
      artifact-metadata: write # Required to associate provenance with artifacts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Verify and package
        env:
          PACKAGE: ${{ inputs.package }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          project_version="$(./gradlew -q ":${PACKAGE}:properties" --property version |
            awk -F': ' '$1 == "version" {print $2; exit}')"
          [[ "${RELEASE_TAG#v}" == "${project_version}" ]] || {
            echo "::error::Release tag does not match ${PACKAGE} ${project_version}"
            exit 1
          }
          ./gradlew ":${PACKAGE}:check" ":${PACKAGE}:installDist" --no-daemon
          mkdir -p dist
          tar -C "${PACKAGE}/build/install" -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"
          (cd dist && sha256sum "${PACKAGE}.tar.gz" > SHA256SUMS)
          java -version 2> dist/java-toolchain.txt
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ inputs.package }}/build/install/${{ inputs.package }}
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign distribution
        env:
          PACKAGE: ${{ inputs.package }}
        run: cosign sign-blob --yes --bundle "dist/${PACKAGE}.sigstore.json" "dist/${PACKAGE}.tar.gz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ inputs.package }}.tar.gz
            dist/SHA256SUMS
            dist/sbom.spdx.json
      - name: Upload release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
