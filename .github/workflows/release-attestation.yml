name: Reusable Release Attestation

on:
  workflow_call:
    inputs:
      subject-path:
        type: string
        required: true

permissions:
  contents: read

jobs:
  attest:
    name: Attest release artifact
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Required to obtain the OIDC identity for provenance.
      attestations: write # Required to publish build provenance.
      artifact-metadata: write # Required to associate provenance with artifacts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.subject-path }}
