name: Reusable Admin CLI CI

on:
  workflow_call:
    inputs:
      language:
        description: rust or java
        required: true
        type: string
      package:
        description: Cargo package or Gradle project name
        required: true
        type: string
      working-directory:
        type: string
        default: .

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Actionlint
        run: |
          bash <(curl -sS https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Run Actionlint
        run: actionlint -color

  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate language
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          case "$LANGUAGE" in
            rust|java) ;;
            *) echo "language must be rust or java" >&2; exit 2 ;;
          esac

      - name: Validate package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [[ -z "${PACKAGE}" ]]; then
            echo "::error::package input must not be empty"
            exit 2
          fi

      - name: Validate language-package consistency
        env:
          LANGUAGE: ${{ inputs.language }}
          PACKAGE: ${{ inputs.package }}
        run: |
          case "${LANGUAGE}" in
            rust)
              if [[ ! "${PACKAGE}" =~ ^kerosene- ]]; then
                echo "::warning::Rust package name '${PACKAGE}' does not follow kerosene- prefix convention"
              fi
              ;;
            java)
              if [[ ! "${PACKAGE}" =~ ^kerosene- ]]; then
                echo "::warning::Java project name '${PACKAGE}' does not follow kerosene- prefix convention"
              fi
              ;;
          esac

  rust-cli:
    if: inputs.language == 'rust'
    needs: [validate-input, actionlint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p "${{ inputs.package }}" --all-targets -- -D warnings
      - run: cargo test -p "${{ inputs.package }}" --locked
      - run: cargo build -p "${{ inputs.package }}" --release --locked
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ inputs.working-directory }}/target/release/${{ inputs.package }}
          if-no-files-found: error

  java-cli:
    if: inputs.language == 'java'
    needs: [validate-input, actionlint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ":${{ inputs.package }}:test" ":${{ inputs.package }}:installDist" --no-daemon
      - run: tar -C "${{ inputs.package }}/build/install" -czf "${{ inputs.package }}.tar.gz" "${{ inputs.package }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ inputs.working-directory }}/${{ inputs.package }}.tar.gz
          if-no-files-found: error
