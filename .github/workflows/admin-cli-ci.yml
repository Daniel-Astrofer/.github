name: Reusable Admin CLI CI

on:
  workflow_call:
    inputs:
      language:
        description: rust or java
        required: true
        type: string
      package:
        description: Cargo package or Gradle project name
        required: true
        type: string
      working-directory:
        type: string
        default: .

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Actionlint (pinned + sha256 verified)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          curl -sfLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          echo "${GITHUB_WORKSPACE}" >> "${GITHUB_PATH}"
      - name: Run Actionlint
        run: actionlint -color

  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate language
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          case "$LANGUAGE" in
            rust|java) ;;
            *) echo "language must be rust or java" >&2; exit 2 ;;
          esac

      - name: Validate package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [[ ! "${PACKAGE}" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "::error::package input must match ^[a-z0-9][a-z0-9-]{0,63}\$"
            exit 2
          fi

      - name: Validate working-directory
        env:
          WD: ${{ inputs.working-directory }}
        run: |
          if [[ "${WD}" == *".."* || "${WD}" == /* ]]; then
            echo "::error::working-directory input validation failed: path traversal detected"
            exit 1
          fi

      - name: Validate language-package consistency
        env:
          LANGUAGE: ${{ inputs.language }}
          PACKAGE: ${{ inputs.package }}
        run: |
          case "${LANGUAGE}" in
            rust)
              if [[ ! "${PACKAGE}" =~ ^kerosene- ]]; then
                echo "::warning::Rust package name '${PACKAGE}' does not follow kerosene- prefix convention"
              fi
              ;;
            java)
              if [[ ! "${PACKAGE}" =~ ^kerosene- ]]; then
                echo "::warning::Java project name '${PACKAGE}' does not follow kerosene- prefix convention"
              fi
              ;;
          esac

  osv-scan:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for vulnerabilities
        uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            -r
            --skip-git
            ./
            --fail-on-vuln=false

  zizmor:
    name: Zizmor SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zizmor
        run: pip install zizmor==1.28.0
      - name: Run Zizmor
        run: zizmor .

  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.working-directory }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'

  rust-cli:
    if: inputs.language == 'rust'
    needs: [validate-input, actionlint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p "${{ inputs.package }}" --all-targets -- -D warnings
      - run: cargo test -p "${{ inputs.package }}" --locked
      - name: Install dependency verification tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-machete --locked
      - run: cargo audit
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories sources
      - run: cargo machete
      - run: cargo build -p "${{ inputs.package }}" --release --locked
      - name: Stage artifact and checksum
        run: |
          mkdir -p admin-cli-dist
          install -m 0755 "target/release/${{ inputs.package }}" "admin-cli-dist/${{ inputs.package }}"
          (cd admin-cli-dist && sha256sum "${{ inputs.package }}" > "${{ inputs.package }}.sha256")
      - uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.working-directory }}/admin-cli-dist
          format: spdx-json
          output-file: ${{ inputs.working-directory }}/admin-cli-dist/${{ inputs.package }}.spdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ inputs.working-directory }}/admin-cli-dist
          if-no-files-found: error

  java-cli:
    if: inputs.language == 'java'
    needs: [validate-input, actionlint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - run: ./gradlew ":${{ inputs.package }}:test" ":${{ inputs.package }}:installDist" --no-daemon
      - run: tar -C "${{ inputs.package }}/build/install" -czf "${{ inputs.package }}.tar.gz" "${{ inputs.package }}"
      - run: sha256sum "${{ inputs.package }}.tar.gz" > "${{ inputs.package }}.tar.gz.sha256"
      - uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.package }}/build/install/${{ inputs.package }}
          format: spdx-json
          output-file: ${{ inputs.working-directory }}/${{ inputs.package }}.spdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ inputs.working-directory }}/${{ inputs.package }}.tar.gz
            ${{ inputs.working-directory }}/${{ inputs.package }}.tar.gz.sha256
            ${{ inputs.working-directory }}/${{ inputs.package }}.spdx.json
          if-no-files-found: error
