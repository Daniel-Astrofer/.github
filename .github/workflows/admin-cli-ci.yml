name: Reusable Admin CLI CI

on:
  workflow_call:
    inputs:
      language:
        description: rust or java
        required: true
        type: string
      package:
        description: Cargo package or Gradle project name
        required: true
        type: string
      working-directory:
        type: string
        default: .

permissions:
  contents: read

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate language
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          case "$LANGUAGE" in
            rust|java) ;;
            *) echo "language must be rust or java" >&2; exit 2 ;;
          esac

  rust-cli:
    if: inputs.language == 'rust'
    needs: validate-input
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p "${{ inputs.package }}" --all-targets -- -D warnings
      - run: cargo test -p "${{ inputs.package }}" --locked
      - name: Install dependency verification tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-machete --locked
      - run: cargo audit
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories sources
      - run: cargo machete
      - run: cargo build -p "${{ inputs.package }}" --release --locked
      - name: Create checksum
        run: sha256sum "target/release/${{ inputs.package }}" > "target/release/${{ inputs.package }}.sha256"
      - uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.working-directory }}/target/release/${{ inputs.package }}
          format: spdx-json
          output-file: ${{ inputs.working-directory }}/target/release/${{ inputs.package }}.spdx.json
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ inputs.working-directory }}/target/release/${{ inputs.package }}
            ${{ inputs.working-directory }}/target/release/${{ inputs.package }}.sha256
            ${{ inputs.working-directory }}/target/release/${{ inputs.package }}.spdx.json
          if-no-files-found: error

  java-cli:
    if: inputs.language == 'java'
    needs: validate-input
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ":${{ inputs.package }}:test" ":${{ inputs.package }}:installDist" --no-daemon
      - run: tar -C "${{ inputs.package }}/build/install" -czf "${{ inputs.package }}.tar.gz" "${{ inputs.package }}"
      - run: sha256sum "${{ inputs.package }}.tar.gz" > "${{ inputs.package }}.tar.gz.sha256"
      - uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.package }}.tar.gz
          format: spdx-json
          output-file: ${{ inputs.working-directory }}/${{ inputs.package }}.spdx.json
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ inputs.working-directory }}/${{ inputs.package }}.tar.gz
            ${{ inputs.working-directory }}/${{ inputs.package }}.tar.gz.sha256
            ${{ inputs.working-directory }}/${{ inputs.package }}.spdx.json
          if-no-files-found: error
