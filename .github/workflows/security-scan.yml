name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      codeql-language:
        description: CodeQL language, or an empty string when unsupported
        type: string
        default: ''
      semgrep:
        description: Run Semgrep's security audit rules
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  semgrep:
    name: Semgrep SAST
    if: inputs.semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.129.0'
      - name: Scan security rules
        run: semgrep scan --config p/security-audit --error --metrics=off .

  codeql:
    name: CodeQL (${{ inputs.codeql-language }})
    if: inputs.codeql-language != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.codeql-language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
