name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      codeql-language:
        description: CodeQL language, or an empty string when unsupported
        type: string
        default: ''
      semgrep:
        description: Run Semgrep's security audit rules
        type: boolean
        default: true
      run-osv:
        description: Run OSV-Scanner for vulnerability scanning
        type: boolean
        default: true
      run-zizmor:
        description: Run Zizmor for GitHub Actions security audit
        type: boolean
        default: true
      run-trivy:
        description: Run Trivy filesystem scan
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # Required to inspect dependency changes in the pull request.
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  semgrep:
    name: Semgrep SAST
    if: inputs.semgrep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.129.0'
      - name: Scan security rules
        run: semgrep scan --config p/security-audit --error --metrics=off .

  codeql:
    name: CodeQL (${{ inputs.codeql-language }})
    if: inputs.codeql-language != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # Required to publish CodeQL results.
      packages: read # Required when the analyzed build consumes GitHub packages.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ inputs.codeql-language }}
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  osv-scanner:
    name: OSV-Scanner
    if: inputs.run-osv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            -r
            --skip-git
            ./

  zizmor:
    name: Zizmor
    if: inputs.run-zizmor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Zizmor
        run: pip install zizmor==1.28.0
      - name: Audit GitHub Actions
        run: zizmor .

  trivy:
    name: Trivy filesystem scan
    if: inputs.run-trivy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # Required to upload Trivy SARIF results.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy
