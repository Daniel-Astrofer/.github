name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      codeql-language:
        description: CodeQL language, or an empty string when unsupported
        type: string
        default: ''
      semgrep:
        description: Run Semgrep's security audit rules
        type: boolean
        default: true
      run-osv:
        description: Run OSV-Scanner for vulnerability scanning
        type: boolean
        default: true
      run-zizmor:
        description: Run Zizmor for GitHub Actions security audit
        type: boolean
        default: true
      run-trivy:
        description: Run Trivy filesystem scan
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  semgrep:
    name: Semgrep SAST
    if: inputs.semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.129.0'
      - name: Scan security rules
        run: semgrep scan --config p/security-audit --error --metrics=off .

  codeql:
    name: CodeQL (${{ inputs.codeql-language }})
    if: inputs.codeql-language != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.codeql-language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  osv-scanner:
    name: OSV-Scanner
    if: inputs.run-osv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@v1
      - name: Scan for vulnerabilities
        run: osv-scanner --recursive .

  zizmor:
    name: Zizmor
    if: inputs.run-zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zizmor
        run: pip install zizmor
      - name: Audit GitHub Actions
        run: zizmor .

  trivy:
    name: Trivy filesystem scan
    if: inputs.run-trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@v0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
