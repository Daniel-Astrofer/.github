name: Reusable Rust Release

on:
  workflow_call:
    inputs:
      package:
        description: Cargo package and release binary name
        required: true
        type: string
      features:
        description: Comma-separated release features
        required: true
        type: string
      forbidden-features:
        description: Comma-separated features that must never enter a release
        required: false
        default: ''
        type: string
      tee-hw:
        description: Whether the artifact was compiled for hardware TEE support
        required: false
        default: false
        type: boolean
      tpm:
        description: Whether the artifact was compiled for TPM support
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, sign and attest release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release contract
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
          FORBIDDEN_FEATURES: ${{ inputs.forbidden-features }}
          PACKAGE: ${{ inputs.package }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TEE_HW: ${{ inputs.tee-hw }}
          TPM: ${{ inputs.tpm }}
        run: |
          set -euo pipefail
          normalize() { tr ',' '\n' | sed '/^[[:space:]]*$/d' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }

          while IFS= read -r forbidden; do
            if normalize <<< "${FEATURES}" | grep -Fxq "${forbidden}"; then
              echo "::error::Forbidden release feature enabled: ${forbidden}"
              exit 1
            fi
          done < <(normalize <<< "${FORBIDDEN_FEATURES}")

          has_feature() { normalize <<< "${FEATURES}" | grep -Fxq "$1"; }
          [[ "${TEE_HW}" != "true" ]] || has_feature tee_hw || {
            echo "::error::tee-hw metadata requires the tee_hw Cargo feature"
            exit 1
          }
          [[ "${TPM}" != "true" ]] || has_feature tpm || {
            echo "::error::tpm metadata requires the tpm Cargo feature"
            exit 1
          }

          package_version="$(cargo metadata --no-deps --format-version 1 |
            jq -er --arg package "${PACKAGE}" '.packages[] | select(.name == $package) | .version')"
          if [[ "${RELEASE_TAG#v}" != "${package_version}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match ${PACKAGE} ${package_version}"
            exit 1
          fi

      - name: Install Rust components
        run: |
          rustup set profile minimal
          rustup component add clippy rustfmt

      - name: Verify release source
        env:
          FEATURES: ${{ inputs.features }}
          PACKAGE: ${{ inputs.package }}
        run: |
          cargo fmt --check
          cargo clippy --locked --package "${PACKAGE}" --all-targets \
            --no-default-features --features "${FEATURES}" \
            -- -D clippy::correctness -D clippy::suspicious
          cargo test --locked --package "${PACKAGE}" \
            --no-default-features --features "${FEATURES}"

      - name: Build release binary
        env:
          FEATURES: ${{ inputs.features }}
          PACKAGE: ${{ inputs.package }}
        run: cargo build --locked --release --package "${PACKAGE}" --no-default-features --features "${FEATURES}"

      - name: Create release evidence
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
          PACKAGE: ${{ inputs.package }}
          TEE_HW: ${{ inputs.tee-hw }}
          TPM: ${{ inputs.tpm }}
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 "target/release/${PACKAGE}" "dist/${PACKAGE}"
          (
            cd dist
            sha256sum "${PACKAGE}" > SHA256SUMS
          )
          rustc -Vv > dist/rust-toolchain.txt
          cargo -V >> dist/rust-toolchain.txt
          jq -n \
            --arg component "${PACKAGE}" \
            --arg commit "${GITHUB_SHA}" \
            --arg features "${FEATURES}" \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson dealer_lab false \
            --argjson production "$(tr ',' '\n' <<< "${FEATURES}" | grep -Fxq production && echo true || echo false)" \
            --argjson tee_hw "${TEE_HW}" \
            --argjson tpm "${TPM}" \
            '{
              schema_version: 1,
              component: $component,
              source: {
                repository: $source_repository,
                ref: $source_ref,
                commit: $commit
              },
              build: {
                features: ($features | split(",") | map(gsub("^\\s+|\\s+$"; ""))),
                dealer_lab: $dealer_lab,
                production: $production,
                tee_hw: $tee_hw,
                tpm: $tpm,
                toolchain_file: "rust-toolchain.txt"
              },
              verification: {
                tests: "passed",
                workflow_run: $workflow_run
              }
            }' > dist/release-metadata.json

      - name: Generate binary SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - uses: sigstore/cosign-installer@v3
      - name: Sign binary with keyless Sigstore identity
        env:
          PACKAGE: ${{ inputs.package }}
        run: cosign sign-blob --yes --bundle "dist/${PACKAGE}.sigstore.json" "dist/${PACKAGE}"

      - name: Attest release evidence
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/${{ inputs.package }}
            dist/SHA256SUMS
            dist/sbom.spdx.json
            dist/release-metadata.json

      - name: Upload immutable release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
