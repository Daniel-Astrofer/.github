name: Reusable Rust CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      production-features:
        type: string
        default: production
      enforce-format:
        type: boolean
        default: true
      test-arguments:
        description: Arguments passed to cargo test
        type: string
        default: --workspace --all-features --locked
      clippy-arguments:
        description: Arguments passed to cargo clippy before lint levels
        type: string
        default: --workspace --all-targets --all-features
      run-audit:
        type: boolean
        default: true
      run-deny:
        type: boolean
        default: true
      run-machete:
        type: boolean
        default: true
      cache-key:
        description: Cache key for Cargo registry and build artifacts
        type: string
        default: cargo-cache
      concurrency-group:
        description: Concurrency group to prevent duplicate runs
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency-group }}${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.working-directory }}/target
          key: ${{ inputs.cache-key }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ runner.os }}
          restore-keys: |
            ${{ inputs.cache-key }}-${{ runner.os }}-
      - name: Install Rust components
        run: |
          rustup set profile minimal
          rustup component add clippy rustfmt
      - name: Check formatting
        if: inputs.enforce-format
        run: cargo fmt --check
      - name: Check default features
        run: cargo check
      - name: Check production features
        if: inputs.production-features != ''
        run: cargo check --no-default-features --features "${{ inputs.production-features }}"
      - name: Clippy
        run: cargo clippy ${{ inputs.clippy-arguments }} -- -D clippy::correctness -D clippy::suspicious
      - name: Test
        run: cargo test ${{ inputs.test-arguments }}
      - name: Install dependency security tools
        if: inputs.run-audit || inputs.run-machete
        run: |
          if [[ "${{ inputs.run-audit }}" == "true" ]]; then
            cargo install cargo-audit --locked
          fi
          if [[ "${{ inputs.run-machete }}" == "true" ]]; then
            cargo install cargo-machete --locked
          fi
      - name: Audit dependency vulnerabilities
        if: inputs.run-audit
        run: cargo audit
      - name: Enforce dependency advisories and sources
        if: inputs.run-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories sources
      - name: Detect unused dependencies
        if: inputs.run-machete
        run: cargo machete
