name: Reusable Rust CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      production-features:
        type: string
        default: production
      enforce-format:
        type: boolean
        default: true
      test-arguments:
        description: Arguments passed to cargo test
        type: string
        default: --workspace --all-features --locked
      clippy-arguments:
        description: Arguments passed to cargo clippy before lint levels
        type: string
        default: --workspace --all-targets --all-features
      run-audit:
        type: boolean
        default: true
      run-deny:
        type: boolean
        default: true
      run-machete:
        type: boolean
        default: true
      cache-key:
        description: Cache key for Cargo registry and build artifacts
        type: string
        default: cargo-cache
      concurrency-group:
        description: Concurrency group to prevent duplicate runs
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency-group }}${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Verify Rust workspace
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate working-directory
        shell: bash
        working-directory: .
        env:
          WD: ${{ inputs.working-directory }}
        run: |
          if [[ "${WD}" == *".."* || "${WD}" == /* ]]; then
            echo "::error::working-directory input validation failed: path traversal detected"
            exit 1
          fi
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.working-directory }}/target
          key: ${{ inputs.cache-key }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ runner.os }}
          restore-keys: |
            ${{ inputs.cache-key }}-${{ runner.os }}-
      - name: Install Rust components
        run: |
          rustup set profile minimal
          rustup component add clippy rustfmt
      - name: Check formatting
        if: inputs.enforce-format
        run: cargo fmt --check
      - name: Check default features
        run: cargo check
      - name: Check production features
        if: inputs.production-features != ''
        env:
          PRODUCTION_FEATURES: ${{ inputs.production-features }}
        run: cargo check --no-default-features --features "${PRODUCTION_FEATURES}"
      - name: Clippy
        env:
          CLIPPY_ARGUMENTS: ${{ inputs.clippy-arguments }}
        run: |
          read -r -a arguments <<< "${CLIPPY_ARGUMENTS}"
          cargo clippy "${arguments[@]}" -- -D clippy::correctness -D clippy::suspicious
      - name: Test
        env:
          TEST_ARGUMENTS: ${{ inputs.test-arguments }}
        run: |
          read -r -a arguments <<< "${TEST_ARGUMENTS}"
          cargo test "${arguments[@]}"
      - name: Install dependency security tools
        if: inputs.run-audit || inputs.run-machete
        env:
          RUN_AUDIT: ${{ inputs.run-audit }}
          RUN_MACHETE: ${{ inputs.run-machete }}
        run: |
          if [[ "${RUN_AUDIT}" == "true" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          if [[ "${RUN_MACHETE}" == "true" ]]; then
            cargo install cargo-machete --version 0.9.2 --locked
          fi
      - name: Audit dependency vulnerabilities
        if: inputs.run-audit
        run: cargo audit
      - name: Enforce dependency advisories and sources
        if: inputs.run-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories sources
      - name: Detect unused dependencies
        if: inputs.run-machete
        run: cargo machete
